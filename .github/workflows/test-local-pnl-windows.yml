name: Test local P&L Windows startup

on:
  push:
    branches:
      - agent/pnl-local-one-click
  workflow_dispatch:

jobs:
  windows-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local server dependency
        run: python -m pip install flask==3.1.2

      - name: Start through the real one-click launcher
        shell: powershell
        run: |
          $pythonw = Join-Path $env:pythonLocation 'pythonw.exe'
          if (-not (Test-Path $pythonw)) { throw "pythonw.exe not found at $pythonw" }
          Start-Process $pythonw -ArgumentList 'OPEN_BT38_PNL.pyw'

      - name: Wait for localhost and verify health
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          $response = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/health' -TimeoutSec 2
              if ($response.ok) { break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if ($null -eq $response -or -not $response.ok) {
            Write-Host 'Launcher did not produce a healthy server on 127.0.0.1:5000'
            if (Test-Path 'instance\bt38_pnl_startup.log') { Get-Content 'instance\bt38_pnl_startup.log' }
            throw 'Local P&L launcher failed to start port 5000'
          }
          $response | ConvertTo-Json
          if ($response.port -ne 5000) { throw 'Server is not running on port 5000' }

      - name: Verify homepage
        shell: powershell
        run: |
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -UseBasicParsing -TimeoutSec 10
          if ($page.StatusCode -ne 200) { throw 'Homepage did not return HTTP 200' }
          if ($page.Content -notmatch 'LOCAL SERVER RUNNING') { throw 'Expected local server marker was not found' }

      - name: Show startup log on failure
        if: failure()
        shell: powershell
        run: |
          if (Test-Path 'instance\bt38_pnl_startup.log') { Get-Content 'instance\bt38_pnl_startup.log' }
