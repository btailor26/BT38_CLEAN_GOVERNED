name: Governed Fly Existing Image Restore

# Recovery-only workflow.
# - Restores an already-built Fly image to bt38-prod.
# - Does not build source.
# - Does not merge PR #528.
# - Must run only from fix/full-system-release-alignment while PR #528 is open/unmerged.

on:
  workflow_dispatch:
    inputs:
      confirm_existing_image_restore:
        description: 'Type RESTORE_EXISTING_IMAGE_TO_BT38_PROD'
        required: true
        type: string
      expected_commit:
        description: 'Exact CURRENT PR #528 head SHA'
        required: true
        type: string
      image:
        description: 'Exact existing registry.fly.io/bt38-prod:deployment-* image'
        required: true
        type: string

concurrency:
  group: governed-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact PR 528 recovery approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUIRED_TEST_BRANCH="fix/full-system-release-alignment"
          REQUIRED_PR_NUMBER="528"

          test "${{ inputs.confirm_existing_image_restore }}" = "RESTORE_EXISTING_IMAGE_TO_BT38_PROD"
          test "${{ github.ref_name }}" = "$REQUIRED_TEST_BRANCH"

          PR_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls/$REQUIRED_PR_NUMBER")"

          export PR_JSON
          PR_STATE="$(python -c 'import json,os; print(json.loads(os.environ["PR_JSON"])["state"])')"
          PR_HEAD_REF="$(python -c 'import json,os; print(json.loads(os.environ["PR_JSON"])["head"]["ref"])')"
          PR_HEAD_SHA="$(python -c 'import json,os; print(json.loads(os.environ["PR_JSON"])["head"]["sha"])')"
          PR_MERGED="$(python -c 'import json,os; print(str(json.loads(os.environ["PR_JSON"])["merged"]).lower())')"

          test "$PR_STATE" = "open"
          test "$PR_MERGED" = "false"
          test "$PR_HEAD_REF" = "$REQUIRED_TEST_BRANCH"
          test "${{ inputs.expected_commit }}" = "$PR_HEAD_SHA"
          test "${{ github.sha }}" = "$PR_HEAD_SHA"

          case "${{ inputs.image }}" in
            registry.fly.io/bt38-prod:deployment-*) ;;
            *) echo "BLOCKED: image must be an existing bt38-prod deployment image"; exit 1 ;;
          esac

          echo "EXISTING_IMAGE_RESTORE_GUARD_OK commit=$PR_HEAD_SHA image=${{ inputs.image }}"

  restore:
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact governed commit for fly.toml only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restore exact existing image without build
        shell: bash
        run: |
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          test -f fly.toml
          grep -q 'app = "bt38-prod"' fly.toml

          flyctl deploy \
            --app bt38-prod \
            --config fly.toml \
            --image "${{ inputs.image }}" \
            --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify app and image after restore
        shell: bash
        run: |
          flyctl status --app bt38-prod
          flyctl releases --app bt38-prod --image | head -15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
