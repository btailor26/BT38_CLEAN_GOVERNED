name: Governed Fly Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Type DEPLOY_GITHUB_COMMIT_TO_BT38_PROD'
        required: true
      expected_commit:
        description: 'Exact current PR #528 head SHA'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bt38-prod-governed-deploy
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact current PR 528 GitHub source approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production_deploy }}" = "DEPLOY_GITHUB_COMMIT_TO_BT38_PROD"
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "${{ inputs.expected_commit }}" = "${{ github.sha }}"
          PR_JSON="$(gh api repos/${{ github.repository }}/pulls/528)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          PR_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.head.ref')"
          test "$PR_STATE" = "open"
          test "$PR_MERGED" = "false"
          test "$PR_BRANCH" = "fix/full-system-release-alignment"
          test "$PR_HEAD" = "${{ inputs.expected_commit }}"
          echo "GOVERNED_SOURCE_APPROVED commit=$PR_HEAD"

  audit:
    needs: source-deploy-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev
      - name: Verify governed production inputs
        run: |
          test -f Dockerfile
          test -f fly.toml
          test -f pyproject.toml
          test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml
      - name: Reject corrupt production source files
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.py', '.html', '.js', '.toml', '.md'}:
                  continue
              if b'\0' in path.read_bytes():
                  bad.append(str(path))
          if bad:
              raise SystemExit('Null bytes found in production source: ' + ', '.join(bad))
          print('SOURCE_INTEGRITY_OK')
          PY
      - name: Compile production runtime
        run: |
          uv run python -m py_compile \
            main.py app.py models.py fbm_models.py \
            governed_routes.py governed_group_routes.py governed_group_propagation_routes.py \
            governed_runtime_visibility_routes.py governed_fbm_routes.py governed_fbm_manual_routes.py \
            governed_packlink_callback_routes.py services/fbm_provider_contract.py \
            services/fbm_order_mapper.py services/fbm_marketplace_destination.py \
            services/fbm_amazon_order_profile.py services/fbm_amazon_shipping_adapter.py \
            services/fbm_packlink_adapter.py services/fbm_packlink_callback.py \
            services/fbm_packlink_event_processor.py services/fbm_carrier_mapping.py \
            services/fbm_marketplace_confirmation.py services/fbm_post_purchase.py \
            services/fbm_shipping_state.py services/governed_fbm_page_alignment.py \
            services/governed_amazon_tracking_readback.py services/governed_exact_ebay_order_hydration.py \
            services/governed_marketplace_dispatch_truth_recovery.py \
            services/governed_ebay_oauth_scopes.py services/governed_ebay_shipping_notification_alignment.py \
            services/governed_runtime_engine.py services/governed_webhook_execution.py \
            services/governed_webhook_alignment.py services/governed_push_execution.py \
            services/governed_ebay_inventory_import.py services/governed_ebay_post_deploy_alignment.py \
            services/governed_amazon_inventory_import.py services/governed_amazon_listing_fulfillment_refresh.py \
            services/governed_amazon_subscription_visibility.py services/governed_amazon_mcf_notification_alignment.py \
            services/governed_mcf_confirmation.py services/governed_mcf_tracking.py \
            services/governed_mcf_tracking_startup_alignment.py services/governed_marketplace_order_import.py \
            services/governed_order_stock_mutation.py services/governed_warehouse_sync.py \
            scripts/verify_production_db_contract.py
      - name: Run deployment contracts
        run: |
          uv run python -m pytest -q \
            tests/test_runtime_deployment_contract.py tests/test_fba_targeted_update_contract.py \
            tests/test_webhook_scoped_reconcile_contract.py tests/test_webhook_push_alignment_contract.py \
            tests/test_ui_production_alignment_contract.py tests/test_amazon_subscription_visibility_contract.py \
            tests/test_amazon_mcf_notification_alignment_contract.py tests/test_fbm_page_bounded_alignment_contract.py \
            tests/test_fbm_packlink_contract.py tests/test_fbm_packlink_import_alignment_contract.py \
            tests/test_fbm_amazon_tracking_contract.py tests/test_fbm_amazon_confirmation_payload.py \
            tests/test_fbm_manual_shipping_order_contract.py tests/test_marketplace_tracking_readback_contract.py \
            tests/test_marketplace_dispatch_truth_recovery_contract.py tests/test_production_db_contract_gate.py \
            tests/test_runtime_no_automatic_recovery_contract.py tests/test_deploy_no_recovery_contract.py

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact audited GitHub commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Detect governed image restore mode
        id: restore_mode
        shell: bash
        run: |
          RESTORE_IMAGE="$(awk -F'"' '/^[[:space:]]*image[[:space:]]*=/ {print $2; exit}' fly.toml)"
          if [ -n "$RESTORE_IMAGE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=$RESTORE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "GOVERNED_IMAGE_RESTORE=$RESTORE_IMAGE"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify candidate image DB contract against production Neon
        if: steps.restore_mode.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CHECK_B64="$(base64 -w0 scripts/verify_production_db_contract.py)"
          flyctl ssh console --app bt38-prod --command "sh -lc 'printf %s \"$CHECK_B64\" | base64 -d > /tmp/bt38-db-contract.py && cd /app && .venv/bin/python /tmp/bt38-db-contract.py'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy exact GitHub commit with Fly remote builder
        run: |
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          flyctl deploy --app bt38-prod --config fly.toml --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify critical deployed source and state exact mismatch reason
        if: steps.restore_mode.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            Dockerfile
            fly.toml
            main.py
            app.py
            governed_fbm_routes.py
            governed_fbm_manual_routes.py
            templates/fbm.html
            static/js/fbm_tracking_journey.js
            services/governed_fbm_page_alignment.py
            services/governed_fbm_lifecycle_alignment.py
            services/fbm_marketplace_confirmation.py
            services/fbm_post_purchase.py
            services/governed_runtime_engine.py
            services/governed_webhook_execution.py
            services/governed_marketplace_dispatch_truth_recovery.py
            scripts/verify_production_db_contract.py
          )
          FAILED=0
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "BLOCKED: audited GitHub source is missing required file '$FILE'."
              FAILED=1
              continue
            fi
            EXPECTED="$(sha256sum "$FILE" | awk '{print $1}')"
            REMOTE_LINE="$(flyctl ssh console --app bt38-prod --command "sh -lc 'if [ ! -f /app/$FILE ]; then echo MISSING; else sha256sum /app/$FILE; fi'" | tail -n 1 | tr -d '\r')"
            if [ "$REMOTE_LINE" = "MISSING" ]; then
              echo "BLOCKED: Fly /app is missing critical file '$FILE'."
              FAILED=1
              continue
            fi
            REMOTE="$(printf '%s\n' "$REMOTE_LINE" | awk '{print $1}')"
            if [ "$REMOTE" != "$EXPECTED" ]; then
              echo "BLOCKED: Fly source mismatch in '$FILE'. GitHub=$EXPECTED Fly=$REMOTE"
              FAILED=1
            else
              echo "SOURCE_OK: $FILE"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "BLOCKED: critical deployed source mismatch. Reasons are listed above by filename; runtime-generated files are intentionally ignored."
            exit 1
          fi
          echo "CRITICAL_DEPLOYED_SOURCE_OK commit=${{ inputs.expected_commit }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed image DB contract against production Neon
        if: steps.restore_mode.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python scripts/verify_production_db_contract.py'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Confirm governed image restore
        if: steps.restore_mode.outputs.enabled == 'true'
        run: |
          echo "RESTORED_KNOWN_GOOD_IMAGE=${{ steps.restore_mode.outputs.image }}"
          echo "Source fingerprint comparison is intentionally skipped because this run restores a previously proven image rather than rebuilding current source."
      - name: Restore Packlink callback secret setting
        if: steps.restore_mode.outputs.enabled != 'true'
        shell: bash
        run: |
          CALLBACK_SECRET="$(flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import hashlib,os; key=str(os.environ.get(\\\"PACKLINK_API_KEY\\\") or \\\"\\\").strip(); assert key, \\\"PACKLINK_API_KEY missing\\\"; print(hashlib.sha256((\\\"bt38-packlink-callback:\\\"+key).encode()).hexdigest())\"'" | tail -n 1)"
          test -n "$CALLBACK_SECRET"
          flyctl secrets set --app bt38-prod PACKLINK_CALLBACK_SECRET="$CALLBACK_SECRET"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Restore Packlink callback registration
        if: steps.restore_mode.outputs.enabled != 'true'
        shell: bash
        run: |
          flyctl ssh console --app bt38-prod --command "sh -lc \"cd /app && .venv/bin/python -c 'from app import app; from services.fbm_packlink_adapter import PacklinkAdapter; from governed_packlink_callback_routes import _register_callback; ctx=app.test_request_context(base_url=\\\"https://bt38-prod.fly.dev\\\"); ctx.push(); callback_url=_register_callback(PacklinkAdapter()); print(\\\"PACKLINK_CALLBACK_REGISTERED=\\\" + callback_url)'\""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
