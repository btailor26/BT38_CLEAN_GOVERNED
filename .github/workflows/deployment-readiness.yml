name: Deployment Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/full-system-release-alignment

jobs:
  deployment-readiness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev

      - name: Compile production entry points and changed runtime
        run: |
          uv run python -m py_compile \
            main.py \
            app.py \
            models.py \
            fbm_models.py \
            governed_routes.py \
            governed_group_routes.py \
            governed_group_propagation_routes.py \
            governed_mcf_routes.py \
            governed_runtime_visibility_routes.py \
            governed_fbm_routes.py \
            governed_fbm_manual_routes.py \
            governed_packlink_callback_routes.py \
            services/fbm_provider_contract.py \
            services/fbm_order_mapper.py \
            services/fbm_marketplace_destination.py \
            services/fbm_amazon_order_profile.py \
            services/fbm_amazon_shipping_adapter.py \
            services/fbm_amazon_vtr.py \
            services/fbm_packlink_adapter.py \
            services/fbm_packlink_callback.py \
            services/fbm_packlink_event_processor.py \
            services/fbm_post_purchase.py \
            services/fbm_marketplace_confirmation.py \
            services/fbm_shipping_state.py \
            services/governed_fbm_page_alignment.py \
            services/governed_fbm_lifecycle_alignment.py \
            services/governed_amazon_tracking_readback.py \
            services/governed_exact_ebay_order_hydration.py \
            services/governed_ebay_oauth_scopes.py \
            services/governed_ebay_shipping_notification_alignment.py \
            services/governed_ebay_post_deploy_alignment.py \
            services/governed_runtime_engine.py \
            services/governed_webhook_execution.py \
            services/governed_webhook_alignment.py \
            services/governed_push_execution.py \
            services/governed_ebay_inventory_import.py \
            services/governed_amazon_inventory_import.py \
            services/governed_amazon_listing_fulfillment_refresh.py \
            services/governed_listing_structure_reconcile.py \
            services/governed_marketplace_order_import.py \
            services/governed_order_stock_mutation.py \
            services/governed_mcf_execution.py \
            services/governed_order_clarity_alignment.py \
            services/governed_warehouse_sync.py \
            services/governed_warehouse_inbound_alignment.py \
            services/governed_warehouse_inbound_installer.py

      - name: Verify deterministic production build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f fly.toml
          test -f pyproject.toml
          test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml

          RESTORE_IMAGE="$(awk -F'"' '/^[[:space:]]*image[[:space:]]*=/ {print $2; exit}' fly.toml)"
          if [ -n "$RESTORE_IMAGE" ]; then
            test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
            test "$RESTORE_IMAGE" = "registry.fly.io/bt38-prod:deployment-01M1HEHKG88QBJ1Y75HJM521QY"
            ! grep -q '^[[:space:]]*dockerfile[[:space:]]*=' fly.toml
            echo "GOVERNED_IMAGE_RESTORE_READY=$RESTORE_IMAGE"
          else
            grep -q 'dockerfile = "Dockerfile"' fly.toml
            ! grep -q '^[[:space:]]*image[[:space:]]*=' fly.toml
            echo "DETERMINISTIC_SOURCE_BUILD_READY"
          fi

      - name: Run deployment readiness contracts
        run: |
          uv run python -m pytest -q \
            tests/test_runtime_deployment_contract.py \
            tests/test_fba_targeted_update_contract.py \
            tests/test_webhook_scoped_reconcile_contract.py \
            tests/test_webhook_push_alignment_contract.py \
            tests/test_ui_production_alignment_contract.py \
            tests/test_amazon_eventbridge_listing_subscription_contract.py \
            tests/test_listing_structure_sync_contract.py \
            tests/test_github_fly_only_deployment_contract.py \
            tests/test_amazon_public_appstore_alignment_contract.py \
            tests/test_fbm_packlink_contract.py \
            tests/test_fbm_packlink_import_alignment_contract.py \
            tests/test_fbm_amazon_tracking_contract.py \
            tests/test_fbm_amazon_confirmation_payload.py \
            tests/test_fbm_manual_shipping_order_contract.py \
            tests/test_fbm_ebay_shipping_tracking_alignment_contract.py \
            tests/test_order_clarity_alignment_contract.py \
            tests/test_marketplace_tracking_readback_contract.py \
            tests/test_fbm_marketplace_lifecycle_authority_contract.py \
            tests/test_governed_warehouse_inbound_contract.py
