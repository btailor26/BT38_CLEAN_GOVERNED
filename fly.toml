app = "bt38-prod"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Webhooks remain the immediate listing path. This enables the existing
  # bounded eight-hour importer as recovery when a marketplace notification
  # is unavailable or missed; the importer still obeys the database fuses.
  ENABLE_GOVERNED_8H_HYDRATION = "true"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
